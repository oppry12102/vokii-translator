apply plugin: 'com.android.application'

android {
    namespace 'com.vokii.translator'
    compileSdk 34

    defaultConfig {
        applicationId "com.vokii.translator"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "2.5.2"

        // App is Chinese/English only — drop the ~80 locale translations that
        // AndroidX/Material libraries ship, trimming resources.arsc.
        resConfigs "zh", "en"

        // Only ship arm64-v8a: modern Huawei phones only.
        ndk {
            abiFilters 'arm64-v8a'
        }

        // BuildConfig fields — populated at configuration time from
        // local.properties. The API key is gitignored at the source level
        // (see .gitignore) but ends up compiled into BuildConfig.java, so it
        // ships inside the APK — anyone who decompiles the APK can recover
        // it. That's the trade-off for "fresh install just works". Users
        // who care about key isolation can override at runtime via the
        // settings screen (persisted to SharedPreferences).
        Properties localProps = new Properties()
        File lp = rootProject.file('local.properties')
        if (lp.exists()) {
            lp.withInputStream { localProps.load(it) }
        }
        String qwenKey = localProps.getProperty('QWEN_API_KEY', '').trim()

        // Qwen-Omni Realtime (DashScope) — joint pipeline (opt-in fallback).
        // Audio is streamed over a WebSocket; the model returns {zh,en}
        // directly (one-stage). Endpoint is a wss:// URL; the model id is
        // appended as ?model=.
        buildConfigField "String", "DEFAULT_QWEN_API_KEY",         "\"${qwenKey}\""
        buildConfigField "String", "DEFAULT_QWEN_ENDPOINT",        "\"wss://dashscope.aliyuncs.com/api-ws/v1/realtime\""
        buildConfigField "String", "QWEN_MODEL_FLASH",             "\"qwen3.5-omni-flash-realtime-2026-03-15\""
        buildConfigField "String", "QWEN_MODEL_PLUS",              "\"qwen3.5-omni-plus-realtime-2026-03-15\""
    }

    signingConfigs {
        release {
            // Signing secrets come from local.properties (gitignored) so the
            // credentials never live in version control — they used to be
            // hardcoded here AND the keystore file was committed, which burned
            // the app's signing identity. The keystore file is now gitignored
            // too. A checkout that hasn't populated local.properties fails
            // assembleRelease loudly (empty store/key) rather than embedding
            // creds into the build script.
            Properties sp = new Properties()
            File lpf = rootProject.file('local.properties')
            if (lpf.exists()) { lpf.withInputStream { sp.load(it) } }
            storeFile file("../keystore/vokii-release.jks")
            storePassword sp.getProperty('vokii.storePassword', '')
            keyAlias sp.getProperty('vokii.keyAlias', '')
            keyPassword sp.getProperty('vokii.keyPassword', '')
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Release lint: was disabled entirely (lintOptions{abortOnError false;
    // checkReleaseBuilds false} inside the release buildType), which hid the
    // security/correctness detectors (HardcodedCredentials, AllowBackup,
    // PackagedPrivateKey, …). Now we RUN them on release and surface findings,
    // but keep abortOnError=false so a fresh set of pre-existing lint issues
    // can be triaged before they start failing release builds. Flip to true
    // once the findings are resolved.
    lint {
        checkReleaseBuilds true
        abortOnError true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE']
        }
    }
}

// Copy each variant's APK into the parent work/ folder after it's assembled,
// so the artifact is where the device-install scripts expect it. Uses
// finalizedBy (Gradle's lifecycle hook) instead of the deprecated
// gradle.buildFinished. finalizedBy only fires when the assemble task itself
// ran, so a build that didn't assemble a variant never touches (and never
// re-mtimes) its APK — that fixes the stale-APK-as-fresh bug the old
// unconditional copy produced (release once looked 3 days fresh).
def vokiiWorkDir = rootProject.projectDir.parentFile
['debug', 'release'].each { variant ->
    def copyTask = tasks.register("copyVokii${variant.capitalize()}Apk") {
        doLast {
            def src = layout.buildDirectory
                    .file("outputs/apk/${variant}/app-${variant}.apk").get().asFile
            if (!src.exists()) return
            def dst = new File(vokiiWorkDir, "vokii-${variant}.apk")
            dst.bytes = src.bytes
            dst.setLastModified(src.lastModified())  // keep the artifact's age honest
            println "[vokii-copy] vokii-${variant}.apk (${src.length()} bytes) -> ${dst}"
        }
    }
    // Wire finalizedBy after evaluation — the AGP assemble* tasks are
    // registered lazily and don't exist yet at this point in configuration,
    // so tasks.named('assembleDebug') throws "not found" during evaluation.
    afterEvaluate {
        def asm = tasks.findByName("assemble${variant.capitalize()}")
        if (asm != null) asm.finalizedBy copyTask
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // org.json is provided by the Android framework (android.jar) at both
    // compile and runtime on device — the standalone artifact is redundant in
    // the shipped APK. It's kept as testImplementation only because JVM unit
    // tests (app/src/test) run against android.jar whose org.json is stubbed
    // ("not mocked") and need a real implementation.
    testImplementation 'org.json:json:20231013'

    testImplementation 'junit:junit:4.13.2'

    // ASR/MT: cloud-only via DashScope. Cascade (fun-asr-realtime ASR →
    // qwen-plus MT) is the default pipeline; the joint Qwen-Omni Realtime
    // path is an opt-in fallback. No on-device speech model, no GMS/HMS
    // dependency. NoOpEngine is the last resort when no API key is set.
}